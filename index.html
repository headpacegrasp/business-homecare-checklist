<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CK Annapolis — Franchise Launch Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;1,9..40,400&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#0B1829;--navy2:#0D2137;--navy3:#0F1F33;--navy4:#132A44;--navy5:#1A3049;
  --gold:#C8A951;--gold-dim:#8B7B3A;--green:#1B6B3A;--green-bright:#2D9F56;
  --red:#C53030;--orange:#D4870E;--gray:#6B7F94;--gray-light:#8FA3B8;
  --text:#E8ECF1;--text-dim:#4A6072;
}
body{font-family:'DM Sans',system-ui,-apple-system,sans-serif;background:var(--navy);color:var(--text);display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sidebar{width:260px;min-width:260px;background:linear-gradient(180deg,var(--navy2),var(--navy));border-right:1px solid var(--navy5);display:flex;flex-direction:column;overflow:hidden}
.sidebar-brand{padding:20px 16px 12px;border-bottom:1px solid var(--navy5)}
.brand-row{display:flex;align-items:center;gap:10px}
.brand-icon{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--green),var(--green-bright));display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff}
.brand-name{font-size:14px;font-weight:700;color:var(--gold);letter-spacing:.5px}
.brand-sub{font-size:11px;color:var(--gray)}
.sidebar-progress{margin-top:12px;background:var(--navy4);border-radius:6px;padding:8px 10px;font-size:11px;color:var(--gray)}
.sidebar-progress .row{display:flex;justify-content:space-between;margin-bottom:4px}
.sidebar-progress .pct{color:var(--gold);font-weight:600}
.bar-track{height:4px;background:var(--navy5);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;border-radius:2px;transition:width .4s}
.bar-fill-gold{background:linear-gradient(90deg,var(--green),var(--green-bright))}
.sidebar-progress .stats{display:flex;justify-content:space-between;margin-top:4px;font-size:10px}
.sidebar-progress .stats .blocked{color:var(--orange)}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 0}
.nav-btn{width:100%;padding:10px 16px;background:transparent;border:none;color:var(--gray-light);cursor:pointer;text-align:left;font-size:12px;font-family:inherit;border-left:3px solid transparent;display:flex;flex-direction:column;gap:3px;transition:all .15s}
.nav-btn:hover{background:rgba(200,169,81,.05)}
.nav-btn.active{background:rgba(200,169,81,.1);color:var(--gold);border-left-color:var(--gold);font-weight:600}
.nav-btn .nav-row{display:flex;align-items:center;gap:6px}
.nav-btn .nav-row .icon{font-size:14px}
.nav-btn .nav-row .label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-btn .mini-bar{display:flex;align-items:center;gap:6px;padding-left:22px}
.nav-btn .mini-bar .bar-track{flex:1;height:3px}
.nav-btn .mini-bar .count{font-size:10px;color:var(--gray);min-width:28px;text-align:right}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--navy5);font-size:10px;color:var(--text-dim);text-align:center}
.sidebar-footer span{color:var(--gold);font-weight:600}

/* MAIN */
.main{flex:1;overflow-y:auto;background:var(--navy3)}
.main-inner{padding:28px clamp(16px,3vw,40px)}

/* DASHBOARD */
h1.page-title{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--gray);margin-bottom:24px}
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:28px}
.kpi-card{border-radius:10px;padding:16px 18px;border:1px solid transparent}
.kpi-card .kpi-label{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.kpi-card .kpi-value{font-size:30px;font-weight:700;line-height:1}
.overall-box{background:var(--navy4);border-radius:12px;padding:20px 24px;margin-bottom:28px;border:1px solid var(--navy5)}
.overall-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.overall-header .title{font-size:15px;font-weight:600}
.overall-header .sub{font-size:12px;color:var(--gray);margin-left:10px}
.overall-header .big-pct{font-size:28px;font-weight:700;color:var(--gold)}
.overall-bar{height:10px;background:var(--navy);border-radius:5px;overflow:hidden;margin-bottom:16px}
.overall-bar .fill{height:100%;background:linear-gradient(90deg,var(--green),var(--green-bright),var(--gold));border-radius:5px;transition:width .5s}
.phase-mini-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.phase-mini{cursor:pointer;background:transparent;border:none;text-align:left;padding:0;font-family:inherit}
.phase-mini .pm-label{font-size:10px;color:var(--gray);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phase-mini .pm-pct{font-size:10px;margin-top:2px}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:28px}
.alert-box{border-radius:12px;padding:18px 20px}
.alert-box h3{margin:0 0 12px;font-size:14px;font-weight:600}
.alert-box .empty{font-size:12px;color:var(--gray)}
.alert-list{display:flex;flex-direction:column;gap:8px;max-height:240px;overflow-y:auto}
.alert-item{border-radius:6px;padding:8px 10px;font-size:12px}
.alert-item .ai-title{font-weight:600;margin-bottom:2px}
.alert-item .ai-sub{font-size:11px;opacity:.7}

.vendor-box{background:var(--navy4);border-radius:12px;padding:20px 24px;border:1px solid var(--navy5)}
.vendor-box h3{margin:0 0 14px;font-size:15px;font-weight:600}
.vendor-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.vendor-card{border-radius:8px;padding:12px 14px;border:1px solid var(--navy5)}
.vendor-card .vc-name{font-size:13px;font-weight:600}
.vendor-card .vc-desc{font-size:10px;color:var(--gray);margin-bottom:6px}
.vendor-card .vc-bar{display:flex;align-items:center;gap:6px}
.vendor-card .vc-bar .count{font-size:10px;color:var(--gray)}

/* PHASE VIEW */
.phase-controls{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.phase-controls input,.phase-controls select{padding:8px 12px;background:var(--navy4);border:1px solid var(--navy5);border-radius:6px;color:var(--text);font-size:12px;font-family:inherit;outline:none}
.phase-controls input{width:220px}
.phase-controls select{cursor:pointer}
.phase-progress{display:flex;align-items:center;gap:10px;margin:8px 0 20px}
.phase-progress .bar-track{flex:1;max-width:300px;height:6px;border-radius:3px}
.phase-progress .pp-label{font-size:12px;color:var(--gold);font-weight:600}

.sub-header{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--navy4);border:1px solid var(--navy5);cursor:pointer;color:var(--text);font-family:inherit;font-size:14px;font-weight:600;margin-bottom:0;transition:border-radius .2s}
.sub-header.open{border-radius:8px 8px 0 0}
.sub-header.closed{border-radius:8px;margin-bottom:12px}
.sub-header .sh-left{display:flex;align-items:center;gap:8px}
.sub-header .sh-bar{width:4px;height:20px;border-radius:2px;background:var(--gold)}
.sub-header .sh-count{font-size:11px;color:var(--gray);font-weight:400;margin-left:4px}
.sub-header .sh-arrow{font-size:12px;color:var(--gray);transition:transform .2s}
.sub-header.open .sh-arrow{transform:rotate(180deg)}

.sub-body{border:1px solid var(--navy5);border-top:none;border-radius:0 0 8px 8px;overflow:hidden;margin-bottom:12px}
.item-row{padding:14px 16px;border-bottom:1px solid rgba(15,37,64,.6);display:flex;align-items:flex-start;gap:12px;transition:background .2s}
.item-row:last-child{border-bottom:none}
.item-row.s-complete{background:rgba(45,159,86,.04)}
.item-row.s-blocked{background:rgba(197,48,48,.04)}

.status-select{min-width:116px;padding:5px 8px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;outline:none;appearance:none;-webkit-appearance:none;font-family:inherit;border-width:1px;border-style:solid}
.ss-not_started{background:#F1F3F6;color:#8B95A5;border-color:rgba(139,149,165,.25)}
.ss-in_progress{background:#FFF8EB;color:#D4870E;border-color:rgba(212,135,14,.25)}
.ss-complete{background:#EEFBF0;color:#1B7D3A;border-color:rgba(27,125,58,.25)}
.ss-blocked{background:#FFF0F0;color:#C53030;border-color:rgba(197,48,48,.25)}
.ss-na{background:#F3F4F6;color:#6B7280;border-color:rgba(107,114,128,.25)}

.item-content{flex:1;min-width:0}
.item-title{font-size:13px;font-weight:600;line-height:1.3}
.item-title.done{text-decoration:line-through;color:var(--green-bright)}
.item-title.na{opacity:.5}
.item-summary{font-size:11px;color:var(--gray);margin-top:3px;line-height:1.4}
.item-meta{display:flex;gap:16px;margin-top:6px;font-size:10px;color:var(--text-dim)}
.item-action{font-size:10px;color:#5A7A94;margin-top:3px}
.item-action strong{color:#6B8FAA}
.item-note{margin-top:6px;padding:5px 8px;background:rgba(200,169,81,.06);border:1px solid rgba(200,169,81,.15);border-radius:4px;font-size:11px;color:var(--gold);cursor:pointer}
.note-edit{margin-top:6px;display:flex;gap:6px}
.note-edit input{flex:1;padding:5px 8px;background:var(--navy4);border:1px solid rgba(200,169,81,.25);border-radius:4px;font-size:11px;color:var(--gold);outline:none;font-family:inherit}
.note-edit .btn-save{padding:5px 10px;background:var(--gold);border:none;border-radius:4px;font-size:10px;font-weight:600;color:var(--navy);cursor:pointer;font-family:inherit}
.note-edit .btn-cancel{padding:5px 10px;background:var(--navy5);border:none;border-radius:4px;font-size:10px;color:var(--gray);cursor:pointer;font-family:inherit}
.btn-add-note{margin-top:6px;background:none;border:none;padding:0;font-size:10px;color:var(--text-dim);cursor:pointer;text-decoration:underline;font-family:inherit}

/* Export Button */
.export-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:linear-gradient(135deg,var(--gold),#D4B96A);border:none;border-radius:6px;font-size:12px;font-weight:600;color:var(--navy);cursor:pointer;font-family:inherit;transition:all .2s;box-shadow:0 2px 8px rgba(200,169,81,.25)}
.export-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(200,169,81,.35)}
.export-btn:active{transform:translateY(0)}
.export-btn.exporting{opacity:.7;cursor:wait}
.dash-header-row{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}

/* Mobile menu toggle */
.mobile-header{display:none;position:sticky;top:0;z-index:100;background:var(--navy2);border-bottom:1px solid var(--navy5);padding:12px 16px;align-items:center;justify-content:space-between}
.mobile-header .mh-left{display:flex;align-items:center;gap:10px}
.mobile-header .mh-brand{font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.5px}
.mobile-header .mh-sub{font-size:10px;color:var(--gray)}
.mobile-header .mh-pct{font-size:13px;font-weight:700;color:var(--gold)}
.hamburger{background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:4px 8px;border-radius:4px}
.hamburger:hover{background:rgba(200,169,81,.1)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:199}

@media(min-width:1400px){
  .kpi-grid{grid-template-columns:repeat(5,1fr)}
  .vendor-grid{grid-template-columns:repeat(4,1fr)}
  .phase-mini-grid{grid-template-columns:repeat(8,1fr)}
}
@media(max-width:1100px){
  .vendor-grid{grid-template-columns:repeat(3,1fr)}
  .phase-mini-grid{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:900px){
  .sidebar{width:220px;min-width:220px}
  .kpi-grid{grid-template-columns:repeat(3,1fr)}
  .vendor-grid{grid-template-columns:repeat(2,1fr)}
  .phase-mini-grid{grid-template-columns:repeat(4,1fr)}
  .two-col{grid-template-columns:1fr}
  .overall-header{flex-direction:column;gap:6px}
}
@media(max-width:768px){
  body{flex-direction:column;overflow:auto}
  .mobile-header{display:flex}
  .sidebar{position:fixed;left:-280px;top:0;bottom:0;width:270px;min-width:270px;z-index:200;transition:left .3s ease;box-shadow:none}
  .sidebar.open{left:0;box-shadow:4px 0 24px rgba(0,0,0,.5)}
  .sidebar-overlay.open{display:block}
  .main{flex:1;overflow-y:auto;min-height:0}
  .kpi-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi-card .kpi-value{font-size:24px}
  .vendor-grid{grid-template-columns:1fr 1fr;gap:10px}
  .phase-mini-grid{grid-template-columns:repeat(4,1fr);gap:6px}
  .two-col{grid-template-columns:1fr;gap:12px}
  .overall-header{flex-direction:column;gap:4px}
  .overall-header .sub{margin-left:0}
  h1.page-title{font-size:20px}
  .item-row{flex-direction:column;gap:8px}
  .status-select{min-width:130px;width:130px}
  .item-meta{flex-wrap:wrap;gap:8px}
  .phase-controls{flex-direction:column}
  .phase-controls input{width:100%}
  .phase-controls select{width:100%}
  .note-edit{flex-wrap:wrap}
  .note-edit input{min-width:0}
  .sub-header{font-size:13px;padding:10px 14px}
  .alert-list{max-height:180px}
}
@media(max-width:400px){
  .kpi-grid{grid-template-columns:1fr 1fr;gap:8px}
  .kpi-card{padding:12px 14px}
  .kpi-card .kpi-value{font-size:20px}
  .vendor-grid{grid-template-columns:1fr;gap:8px}
  .phase-mini-grid{grid-template-columns:repeat(2,1fr)}
  .overall-box{padding:14px 16px}
  .main-inner{padding:16px 12px}
}
</style>
</head>
<body>

<div class="mobile-header" id="mobile-header">
  <div class="mh-left">
    <button class="hamburger" onclick="toggleMobileNav()">☰</button>
    <div><div class="mh-brand">CK ANNAPOLIS</div><div class="mh-sub">Launch Tracker</div></div>
  </div>
  <div class="mh-pct" id="mobile-pct">0%</div>
</div>
<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleMobileNav()"></div>
<nav class="sidebar" id="sidebar"></nav>
<main class="main" id="main"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════
// DATA — COMPREHENSIVE FRANCHISE LAUNCH TRACKER
// ═══════════════════════════════════════════════════════════════════════
const STATUSES = ["not_started","in_progress","complete","blocked","na"];
const STATUS_META = {
  not_started:{label:"Not Started",color:"#8B95A5",bg:"#F1F3F6",icon:"○"},
  in_progress:{label:"In Progress",color:"#D4870E",bg:"#FFF8EB",icon:"◐"},
  complete:{label:"Complete",color:"#1B7D3A",bg:"#EEFBF0",icon:"●"},
  blocked:{label:"Blocked",color:"#C53030",bg:"#FFF0F0",icon:"✕"},
  na:{label:"N/A",color:"#6B7280",bg:"#F3F4F6",icon:"—"}
};

const PHASES = [
// ─── PHASE 1 ────────────────────────────────────────────────────────
{id:"p1",phase:"Phase 1 — Pre-Opening",icon:"⚡",sub_phases:[
{name:"Legal & Business Formation",items:[
{id:"1-1-1",title:"Register Business Entity (LLC)",summary:"File articles of organization with MD SDAT. Creates legal separation between personal and business assets.",action:"File with Maryland Dept. of Assessments & Taxation",timeline:"30-45 days before opening",cost:"$100-300"},
{id:"1-1-2",title:"Obtain Federal EIN",summary:"Employer Identification Number — required for hiring, bank accounts, tax filing.",action:"Apply online at IRS.gov",timeline:"Immediately after formation",cost:"Free"},
{id:"1-1-3",title:"Anne Arundel County Business License",summary:"Local operating permit for Anne Arundel County.",action:"Submit to AA County Office of Finance",timeline:"2-4 weeks",cost:"$50-150"},
{id:"1-1-4",title:"Register with MD Board of Labor",summary:"State employer registration — unemployment insurance, workers' comp, labor law compliance.",action:"Complete online via MD Dept. of Labor portal",timeline:"Before first hire",cost:"Free"},
{id:"1-1-5",title:"RSA License Application — OHCQ",summary:"Maryland RSA license under COMAR 10.07.05. $1,000 non-refundable fee every 3 years per COMAR 10.07.05.04A(k).",action:"Submit complete application package to OHCQ with policy manual, business plan, and all supporting documents",timeline:"60-90 days processing",cost:"$1,000 (3-yr)"},
{id:"1-1-6",title:"RSA Certification — Worker Classification (Health-General 19-4A-11)",summary:"Worker classification / pay practices attestation required at initial licensure and maintained ongoing.",action:"Complete RSA Certification online via OHCQ portal",timeline:"With RSA application",cost:"Included"},
{id:"1-1-7",title:"NPI Registration (National Provider Identifier)",summary:"10-digit unique identifier for healthcare providers. Required for HIPAA transactions, insurance billing, and provider credentialing even for non-medical home care agencies operating as HIPAA covered entities.",action:"Apply at NPPES (National Plan & Provider Enumeration System) — nppes.cms.hhs.gov. Select Type 2 (Organization) NPI.",timeline:"Before opening / before any insurance billing",cost:"Free"},
{id:"1-1-8",title:"Local Health Department Clearances",summary:"Anne Arundel County Dept. of Health approval for personal care services.",action:"Contact AA County Health Dept.",timeline:"2-4 weeks",cost:"Minimal"},
{id:"1-1-9",title:"General Liability Insurance",summary:"Bodily injury / property damage coverage. Min $1-2M.",action:"Obtain quotes from commercial insurance brokers",timeline:"Before opening",cost:"$1,500-3,000/yr"},
{id:"1-1-10",title:"Professional Liability (E&O) Insurance",summary:"Errors & omissions for negligence claims. Min $1-2M.",action:"Work with home care specialist broker",timeline:"Before opening",cost:"$2,000-4,000/yr"},
{id:"1-1-11",title:"Workers' Compensation Insurance",summary:"Mandatory MD coverage for all employees. Covers workplace injuries.",action:"Obtain policy before first hire",timeline:"Before first hire",cost:"2-5% of payroll"},
{id:"1-1-12",title:"Commercial Auto Insurance",summary:"Covers vehicles for business purposes including hired/non-owned auto.",action:"Add commercial auto or HNOA policy",timeline:"Before opening",cost:"$1,200-2,500/yr"},
{id:"1-1-13",title:"Employment Practices Liability (EPLI)",summary:"Wrongful termination, discrimination, harassment claims.",action:"Add as endorsement or standalone ($500K-1M)",timeline:"Before hiring",cost:"$800-1,500/yr"},
{id:"1-1-14",title:"Cyber Liability Insurance",summary:"Data breaches, cyber attacks, client PII exposure.",action:"Discuss with broker ($500K-1M)",timeline:"Before opening",cost:"$500-1,000/yr"},
]},
{name:"Franchise Agreement & Training",items:[
{id:"1-2-1",title:"Sign FDD (Franchise Disclosure Document)",summary:"FTC-required legal disclosure. Must receive 14 days before signing agreement.",action:"Review thoroughly with franchise attorney",timeline:"2-3 weeks review",cost:"Attorney $500-1,500"},
{id:"1-2-2",title:"Execute Franchise Agreement",summary:"Binding contract — territory, fees, responsibilities, 10-year term with renewal.",action:"Sign after FDD 14-day waiting period and legal counsel review",timeline:"After waiting period",cost:"$59,950 franchise fee"},
{id:"1-2-3",title:"Financial Performance Review",summary:"Analyze financial performance data from existing CK franchises. Critical for realistic revenue/profit expectations.",action:"Analyze data, compare to your market and projections",timeline:"During FDD review",cost:"Included in FDD review"},
{id:"1-2-4",title:"Review Territory Rights & Exclusivity",summary:"Understand exact geographic boundaries, population demographics, restrictions on other franchisees.",action:"Map territory, analyze market opportunity within boundaries",timeline:"Before signing",cost:"Included"},
{id:"1-2-5",title:"Complete Corporate Training at HQ",summary:"1-2 weeks intensive at CK headquarters covering all franchise operations.",action:"Schedule within 30 days of signing",timeline:"7-14 days",cost:"Travel $1,500-3,000"},
{id:"1-2-6",title:"Operations Management Training",summary:"Day-to-day ops: scheduling, QA, client management, caregiver supervision, admin.",action:"Complete all modules and pass assessments",timeline:"Part of HQ training",cost:"Included"},
{id:"1-2-7",title:"Sales & Marketing Fundamentals",summary:"CK proven sales methods, referral networks, lead conversion, marketing strategy.",action:"Complete training and receive marketing materials",timeline:"Part of HQ training",cost:"Included"},
{id:"1-2-8",title:"Care Coordinator Certification",summary:"Client assessments, care planning, caregiver-client matching, ongoing care management.",action:"Complete CK certification program",timeline:"Part of HQ training",cost:"Included"},
{id:"1-2-9",title:"Technology Platform Training (Viv, Viventium, CareAcademy)",summary:"Comprehensive training on franchise software — CRM, scheduling, billing, payroll, caregiver management.",action:"Complete all software training modules",timeline:"Part of HQ training",cost:"Included; ongoing fees apply"},
{id:"1-2-10",title:"Compliance & Regulatory Training",summary:"HIPAA privacy, employment laws, caregiver regulations, documentation requirements, COMAR.",action:"Complete compliance training and certifications",timeline:"Part of HQ training",cost:"Included"},
{id:"1-2-11",title:"Interactive Caregiving™ Philosophy Training",summary:"CK's core service philosophy — engaging clients in their own care to improve outcomes. Brand differentiator.",action:"Complete IC training, incorporate into all onboarding and service delivery",timeline:"Part of HQ training",cost:"Included"},
]},
{name:"Office Setup",items:[
{id:"1-3-1",title:"Secure Office Space — Annapolis",summary:"800-1,200 sq ft professional office. Operational hub and client meeting space.",action:"Lease in professional building",timeline:"60 days before opening",cost:"$3,125/month"},
{id:"1-3-2",title:"Verify ADA Compliance",summary:"Americans with Disabilities Act — parking, entrances, restrooms, common areas.",action:"Inspect facility before signing lease",timeline:"During site selection",cost:"Modifications $2K-5K if needed"},
{id:"1-3-3",title:"Professional Appearance for Client Meetings",summary:"Office conveys professionalism, warmth, trustworthiness. Private consultation space required.",action:"Select location with good ambiance, lighting, comfortable meeting areas",timeline:"During site selection",cost:"Included in setup"},

// ═══════════════════════════════════════════════════════════════════════
// APP STATE & STORAGE
// ═══════════════════════════════════════════════════════════════════════
const ALL_ITEMS = PHASES.flatMap(p=>p.sub_phases.flatMap(sp=>sp.items));
const TOTAL = ALL_ITEMS.length;
let statuses = {};
let notes = {};
let activePhase = "dashboard";
let expandedSubs = {};
let searchText = "";
let filterStatus = "all";
let editingNote = null;

async function loadState(){
  try{const s=await window.storage.get("ck-tracker-statuses");if(s)statuses=JSON.parse(s.value)}catch(e){}
  try{const n=await window.storage.get("ck-tracker-notes");if(n)notes=JSON.parse(n.value)}catch(e){}
}
async function saveState(){
  try{await window.storage.set("ck-tracker-statuses",JSON.stringify(statuses))}catch(e){}
  try{await window.storage.set("ck-tracker-notes",JSON.stringify(notes))}catch(e){}
}

// ═══════════════════════════════════════════════════════════════════════
// COMPUTED
// ═══════════════════════════════════════════════════════════════════════
function getStats(){
  const c={not_started:0,in_progress:0,complete:0,blocked:0,na:0};
  ALL_ITEMS.forEach(i=>{c[statuses[i.id]||"not_started"]++});return c;
}
function getPhaseStats(p){
  const items=p.sub_phases.flatMap(sp=>sp.items);const t=items.length;
  const complete=items.filter(i=>statuses[i.id]==="complete").length;
  const blocked=items.filter(i=>statuses[i.id]==="blocked").length;
  const inProg=items.filter(i=>statuses[i.id]==="in_progress").length;
  return{total:t,complete,blocked,inProgress:inProg,pct:t?Math.round(complete/t*100):0};
}

// ═══════════════════════════════════════════════════════════════════════
// RENDER SIDEBAR
// ═══════════════════════════════════════════════════════════════════════
function renderSidebar(){
  const stats=getStats();
  const pct=TOTAL?Math.round(stats.complete/TOTAL*100):0;
  let h=`<div class="sidebar-brand"><div class="brand-row"><div class="brand-icon">CK</div><div><div class="brand-name">COMFORT KEEPERS</div><div class="brand-sub">Annapolis, MD — Launch Tracker</div></div></div>
  <div class="sidebar-progress"><div class="row"><span>Overall Progress</span><span class="pct">${pct}%</span></div><div class="bar-track"><div class="bar-fill bar-fill-gold" style="width:${pct}%"></div></div><div class="stats"><span>${stats.complete} of ${TOTAL} items</span><span class="blocked">${stats.blocked} blocked</span></div></div></div>`;
  h+=`<div class="sidebar-nav"><button class="nav-btn ${activePhase==="dashboard"?"active":""}" onclick="setPhase('dashboard')"><div class="nav-row"><span class="icon">📊</span><span class="label">Dashboard</span></div></button>`;
  PHASES.forEach(p=>{
    const ps=getPhaseStats(p);const shortName=p.phase.replace(/Phase \d+ — /,"");
    h+=`<button class="nav-btn ${activePhase===p.id?"active":""}" onclick="setPhase('${p.id}')"><div class="nav-row"><span class="icon">${p.icon}</span><span class="label">${shortName}</span></div><div class="mini-bar"><div class="bar-track"><div class="bar-fill" style="width:${ps.pct}%;background:${ps.pct===100?"#2D9F56":"#C8A951"}"></div></div><span class="count">${ps.complete}/${ps.total}</span></div></button>`;
  });
  h+=`</div><div class="sidebar-footer">Target Opening: <span>May 30, 2026</span><br>${TOTAL} total items</div>`;
  document.getElementById("sidebar").innerHTML=h;
}

// RENDER DASHBOARD
// ═══════════════════════════════════════════════════════════════════════
function renderDashboard(){
  const stats=getStats();const pct=TOTAL?Math.round(stats.complete/TOTAL*100):0;
  const actionable=TOTAL-stats.na;const pctAct=actionable?Math.round(stats.complete/actionable*100):0;
  const blocked=ALL_ITEMS.filter(i=>statuses[i.id]==="blocked");
  const inProg=ALL_ITEMS.filter(i=>statuses[i.id]==="in_progress");
  let h=`<div class="main-inner" id="dashboard-capture"><div class="dash-header-row"><div><h1 class="page-title">Launch Dashboard</h1><p class="page-sub">Comfort Keepers of Annapolis</p></div><button class="export-btn" id="export-btn" onclick="exportDashboard()">📸 Export as JPG</button></div>`;
  // KPIs
  const kpis=[{l:"Total Items",v:TOTAL,c:"#8FA3B8",bg:"#132A44"},{l:"Complete",v:stats.complete,c:"#2D9F56",bg:"rgba(45,159,86,.08)"},{l:"In Progress",v:stats.in_progress,c:"#D4870E",bg:"rgba(212,135,14,.08)"},{l:"Blocked",v:stats.blocked,c:"#C53030",bg:"rgba(197,48,48,.08)"},{l:"Not Started",v:stats.not_started,c:"#8B95A5",bg:"rgba(139,149,165,.08)"}];
  h+=`<div class="kpi-grid">`;kpis.forEach(k=>{h+=`<div class="kpi-card" style="background:${k.bg};border-color:${k.c}22"><div class="kpi-label">${k.l}</div><div class="kpi-value" style="color:${k.c}">${k.v}</div></div>`});h+=`</div>`;
  // Overall bar
  h+=`<div class="overall-box"><div class="overall-header"><div><span class="title">Overall Completion</span><span class="sub">${stats.complete} of ${TOTAL} total · ${pctAct}% of actionable items</span></div><span class="big-pct">${pct}%</span></div><div class="overall-bar"><div class="fill" style="width:${pct}%"></div></div>`;
  h+=`<div class="phase-mini-grid">`;PHASES.forEach(p=>{const ps=getPhaseStats(p);const sn=p.phase.replace(/Phase \d+ — /,"");h+=`<button class="phase-mini" onclick="setPhase('${p.id}')"><div class="pm-label">${p.icon} ${sn}</div><div class="bar-track"><div class="bar-fill" style="width:${ps.pct}%;background:${ps.pct===100?"#2D9F56":ps.blocked>0?"#C53030":"#C8A951"}"></div></div><div class="pm-pct" style="color:${ps.pct===100?"#2D9F56":"#6B7F94"}">${ps.pct}%</div></button>`});
  h+=`</div></div>`;
  // Blocked + In Progress
  h+=`<div class="two-col"><div class="alert-box" style="background:rgba(197,48,48,.06);border:1px solid rgba(197,48,48,.15)"><h3 style="color:#C53030">🚨 Blocked Items (${blocked.length})</h3>`;
  if(!blocked.length)h+=`<p class="empty">No blocked items — great!</p>`;
  else{h+=`<div class="alert-list">`;blocked.forEach(i=>{h+=`<div class="alert-item" style="background:rgba(197,48,48,.08)"><div class="ai-title" style="color:#F0B0B0">${i.title}</div><div class="ai-sub" style="color:#8B6060">${i.summary.slice(0,120)}…</div></div>`});h+=`</div>`}
  h+=`</div><div class="alert-box" style="background:rgba(212,135,14,.06);border:1px solid rgba(212,135,14,.15)"><h3 style="color:#D4870E">🔄 In Progress (${inProg.length})</h3>`;
  if(!inProg.length)h+=`<p class="empty">Nothing currently in progress.</p>`;
  else{h+=`<div class="alert-list">`;inProg.forEach(i=>{h+=`<div class="alert-item" style="background:rgba(212,135,14,.08)"><div class="ai-title" style="color:#F0D898">${i.title}</div><div class="ai-sub" style="color:#8B7740">${i.summary.slice(0,120)}…</div></div>`});h+=`</div>`}
  h+=`</div></div>`;
  // Vendor grid
  const vendors=[
    {name:"Viv",desc:"Care Management",ids:["1-4-1","1-4-2","1-4-3","1-4-4"]},
    {name:"Viventium",desc:"Payroll & HR",ids:["1-4-5","1-4-6","6-1-5"]},
    {name:"CareAcademy",desc:"LMS / Training",ids:["1-4-7","1-4-8","1-4-9"]},
    {name:"Vita Health",desc:"TB & Screenings",ids:["4-1-1"]},
    {name:"Human Interest",desc:"401(k)",ids:["4-1-2","4-1-3"]},
    {name:"CPA Services",desc:"Tax & Accounting",ids:["4-1-4","4-1-5","4-1-6"]},
    {name:"CK Central/Box",desc:"Doc Submission",ids:["1-4-10"]},
    {name:"PDHA Cert",desc:"National Alliance",ids:["4-2-1","4-2-2"]},
  ];
  h+=`<div class="vendor-box"><h3>Platform & Vendor Status</h3><div class="vendor-grid">`;
  vendors.forEach(v=>{const done=v.ids.filter(id=>statuses[id]==="complete").length;const t=v.ids.length;const allDone=done===t;const hasBlk=v.ids.some(id=>statuses[id]==="blocked");
    h+=`<div class="vendor-card" style="background:${allDone?"rgba(45,159,86,.08)":hasBlk?"rgba(197,48,48,.08)":"#0F2540"};border-color:${allDone?"rgba(45,159,86,.2)":hasBlk?"rgba(197,48,48,.2)":"#1A3049"}"><div class="vc-name" style="color:${allDone?"#2D9F56":"#E8ECF1"}">${v.name}</div><div class="vc-desc">${v.desc}</div><div class="vc-bar"><div class="bar-track" style="flex:1"><div class="bar-fill" style="width:${t?Math.round(done/t*100):0}%;background:${allDone?"#2D9F56":"#C8A951"}"></div></div><span class="count">${done}/${t}</span></div></div>`});
  h+=`</div></div></div>`;
  document.getElementById("main").innerHTML=h;
}

// ═══════════════════════════════════════════════════════════════════════
// RENDER PHASE VIEW
// ═══════════════════════════════════════════════════════════════════════
function renderPhaseView(){
  const phase=PHASES.find(p=>p.id===activePhase);if(!phase)return;
  const ps=getPhaseStats(phase);const q=searchText.toLowerCase();
  let h=`<div class="main-inner"><h1 class="page-title">${phase.icon} ${phase.phase}</h1><div class="phase-progress"><div class="bar-track"><div class="bar-fill bar-fill-gold" style="width:${ps.pct}%"></div></div><span class="pp-label">${ps.complete}/${ps.total} complete</span></div>`;
  h+=`<div class="phase-controls"><input type="text" placeholder="Search items…" value="${searchText}" oninput="searchText=this.value;render()"><select onchange="filterStatus=this.value;render()"><option value="all"${filterStatus==="all"?" selected":""}>All Statuses</option>`;
  STATUSES.forEach(s=>{h+=`<option value="${s}"${filterStatus===s?" selected":""}>${STATUS_META[s].label}</option>`});h+=`</select></div>`;
  phase.sub_phases.forEach((sp,si)=>{
    const key=phase.id+"-"+si;const isOpen=expandedSubs[key]!==false;
    const filtered=sp.items.filter(item=>{
      const sm=filterStatus==="all"||(statuses[item.id]||"not_started")===filterStatus;
      const sq=!q||item.title.toLowerCase().includes(q)||item.summary.toLowerCase().includes(q);return sm&&sq;
    });
    if(!filtered.length)return;
    h+=`<button class="sub-header ${isOpen?"open":"closed"}" onclick="toggleSub('${key}')"><div class="sh-left"><div class="sh-bar"></div><span>${sp.name}</span><span class="sh-count">(${filtered.length} items)</span></div><span class="sh-arrow">▼</span></button>`;
    if(isOpen){
      h+=`<div class="sub-body">`;
      filtered.forEach(item=>{
        const s=statuses[item.id]||"not_started";const m=STATUS_META[s];const note=notes[item.id]||"";const isEd=editingNote===item.id;
        h+=`<div class="item-row s-${s}"><div><select class="status-select ss-${s}" onchange="setItemStatus('${item.id}',this.value)">`;
        STATUSES.forEach(st=>{h+=`<option value="${st}"${s===st?" selected":""}>${STATUS_META[st].icon} ${STATUS_META[st].label}</option>`});
        h+=`</select></div><div class="item-content"><div class="item-title ${s==="complete"?"done":""} ${s==="na"?"na":""}">${item.title}</div><div class="item-summary">${item.summary}</div><div class="item-meta"><span>⏱ ${item.timeline}</span><span>💵 ${item.cost}</span></div><div class="item-action"><strong>Action:</strong> ${item.action}</div>`;
        if(note&&!isEd)h+=`<div class="item-note" onclick="startEditNote('${item.id}')">📝 ${note}</div>`;
        if(isEd)h+=`<div class="note-edit"><input id="note-input-${item.id}" value="${(note||"").replace(/"/g,"&quot;")}" placeholder="Add a note…" onkeydown="if(event.key==='Enter')saveNote('${item.id}')"><button class="btn-save" onclick="saveNote('${item.id}')">Save</button><button class="btn-cancel" onclick="editingNote=null;render()">Cancel</button></div>`;
        if(!note&&!isEd)h+=`<button class="btn-add-note" onclick="startEditNote('${item.id}')">+ Add note</button>`;
        h+=`</div></div>`;
      });
      h+=`</div>`;
    }
  });
  h+=`</div>`;document.getElementById("main").innerHTML=h;
  if(editingNote){const inp=document.getElementById("note-input-"+editingNote);if(inp)inp.focus()}
}

// ═══════════════════════════════════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════════════════════════════════
function setPhase(id){activePhase=id;searchText="";filterStatus="all";editingNote=null;closeMobileNav();render()}
function toggleSub(key){expandedSubs[key]=expandedSubs[key]===false?true:false;render()}
function setItemStatus(id,val){statuses[id]=val;saveState();render()}
function startEditNote(id){editingNote=id;render()}
function saveNote(id){const inp=document.getElementById("note-input-"+id);if(inp)notes[id]=inp.value;editingNote=null;saveState();render()}

function toggleMobileNav(){
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("sidebar-overlay").classList.toggle("open");
}
function closeMobileNav(){
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebar-overlay").classList.remove("open");
}

async function exportDashboard(){
  const btn=document.getElementById("export-btn");
  if(!btn)return;
  const origText=btn.innerHTML;
  btn.innerHTML="⏳ Capturing…";btn.classList.add("exporting");
  try{
    const el=document.getElementById("dashboard-capture");
    // hide the export button during capture
    btn.style.display="none";
    const canvas=await html2canvas(el,{
      backgroundColor:"#0F1F33",
      scale:2,
      useCORS:true,
      logging:false,
      windowWidth:el.scrollWidth,
      windowHeight:el.scrollHeight
    });
    btn.style.display="";
    // convert to jpg blob and trigger download
    canvas.toBlob(function(blob){
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      const date=new Date().toISOString().slice(0,10);
      a.href=url;a.download="CK_Annapolis_Dashboard_"+date+".jpg";
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      URL.revokeObjectURL(url);
    },"image/jpeg",0.95);
  }catch(e){
    console.error("Export failed:",e);
    alert("Export failed. Please try again.");
  }
  btn.innerHTML=origText;btn.classList.remove("exporting");
}

function render(){
  renderSidebar();
  const stats=getStats();const pct=TOTAL?Math.round(stats.complete/TOTAL*100):0;
  const mp=document.getElementById("mobile-pct");if(mp)mp.textContent=pct+"%";
  if(activePhase==="dashboard")renderDashboard();else renderPhaseView();
}

// ═══════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════
(async function(){await loadState();render()})();
</script>
